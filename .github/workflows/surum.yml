# ============================================================================
# Etiket atılınca GitHub'da sürüm oluşturur.
#
# KULLANIM:
#   git tag -a v1.1.0 -m "Yeni oyun: Kelime Avı"
#   git push origin v1.1.0
#
# Gerisi otomatik: son sürümden bu yana ne commit edildiyse toplanıp sürüm
# notu olarak yazılır. Başlık "v1.1.0 · 08.09.2026" biçiminde olur —
# etiket teknik ve sıralanabilir kalır, tarih okunurluk için başlıkta.
#
# NUMARA NASIL ARTAR:
#   v1.0.1  düzeltme      (hata giderildi, davranış aynı)
#   v1.1.0  yeni özellik  (yeni oyun, yeni sayfa, yeni yetenek)
#   v2.0.0  büyük dönüm   (baştan yazılan bir katman, kırıcı değişiklik)
#
# NE ZAMAN ETİKET ATILIR:
#   Her push'a değil — kilometre taşlarına. Deploy sürekli, sürüm ara ara.
#   Günde 15 deploy sürüm olsa liste okunmaz hale gelir.
# ============================================================================
name: Sürüm

on:
  push:
    tags:
      - "v*" # v1.0.0, v1.2.3 …

# Sürüm oluşturmak depoya yazmak demek; diğer workflow'larda okuma yetkisi
# yeterliydi, burada yazma gerekiyor.
permissions:
  contents: write

jobs:
  surum:
    name: Sürüm oluştur
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Notlar önceki etiketle karşılaştırılarak üretiliyor; sığ klonda
          # geçmiş olmadığı için tam geçmiş gerekiyor.
          fetch-depth: 0

      - name: Sürümü yayınla
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TARIH=$(git log -1 --format=%cd --date=format:'%d.%m.%Y' "$GITHUB_REF_NAME")
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME · $TARIH" \
            --generate-notes \
            --verify-tag
