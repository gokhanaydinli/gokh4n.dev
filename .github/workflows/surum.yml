# ============================================================================
# Sürüm — package.json'daki numara değişince kendiliğinden yayınlar.
#
# AKIŞ:
#   1. development dalında çalış
#   2. sürüm çıkarmaya değer bir şey biriktiyse package.json'daki "version"
#      alanını yükselt
#   3. main'e merge et
#   4. gerisi otomatik: etiket atılır, sürüm oluşur, notlar son sürümden bu
#      yana atılan commit'lerden yazılır
#
# NUMARA NASIL ARTAR:
#   1.0.1  düzeltme      (hata giderildi, davranış aynı)
#   1.1.0  yeni özellik  (yeni oyun, yeni sayfa, yeni yetenek)
#   2.0.0  büyük dönüm   (baştan yazılan bir katman)
#
# NEDEN HER PUSH'TA DEĞİL:
#   Günde onlarca deploy oluyor. Her push sürüm olsa liste okunmaz hale
#   gelirdi. Sürüm çıkarmak bilinçli bir karar: package.json'daki tek satırı
#   değiştirmek. Numara aynı kaldığı sürece bu iş hiçbir şey yapmadan geçer.
# ============================================================================
name: Sürüm

on:
  push:
    branches: [main]

# Etiket atmak ve sürüm oluşturmak depoya yazmak demek; diğer
# workflow'larda okuma yetkisi yeterliydi.
permissions:
  contents: write

jobs:
  surum:
    name: Sürüm gerekiyorsa yayınla
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Notlar önceki etiketle karşılaştırılarak üretiliyor; etiketlerin
          # ve geçmişin tamamı gerekiyor.
          fetch-depth: 0

      - name: Sürüm gerekli mi
        id: kontrol
        run: |
          SURUM="v$(node -p "require('./package.json').version")"
          if git rev-parse "$SURUM" >/dev/null 2>&1; then
            echo "Etiket $SURUM zaten var, sürüm çıkarılmıyor."
            echo "gerekli=hayir" >> "$GITHUB_OUTPUT"
          else
            echo "Yeni sürüm: $SURUM"
            echo "gerekli=evet" >> "$GITHUB_OUTPUT"
            echo "surum=$SURUM" >> "$GITHUB_OUTPUT"
          fi

      - name: Etiketle ve yayınla
        if: steps.kontrol.outputs.gerekli == 'evet'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SURUM: ${{ steps.kontrol.outputs.surum }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$SURUM" -m "$SURUM"
          git push origin "$SURUM"
          gh release create "$SURUM" \
            --title "$SURUM · $(date +%d.%m.%Y)" \
            --generate-notes
