<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>gokh4n</title>
<meta name="description" content="Çalışmalar dizini." />
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex" />

<meta property="og:type" content="website" />
<meta property="og:title" content="gokh4n.dev" />
<meta property="og:description" content="Çalışmalar dizini." />
<meta property="og:url" content="https://gokh4n.dev" />

<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%23e9e6df'/><rect x='3' y='3' width='26' height='26' fill='none' stroke='%230d0d0d' stroke-width='3'/><rect x='10' y='10' width='12' height='12' fill='%23ff3b00'/></svg>" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />

<style>
  :root {
    --kagit:  #e9e6df;
    --murekkep: #0d0d0d;
    --vurgu:  #ff3b00;
    --kalinlik: 2px;

    --baslik: "Space Grotesk", ui-sans-serif, system-ui, "Segoe UI", Arial, sans-serif;
    --mono: "Space Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --kagit:  #0d0d0d;
      --murekkep: #e9e6df;
      --vurgu:  #ff5a1f;
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100dvh;
    background: var(--kagit);
    color: var(--murekkep);
    font-family: var(--baslik);
    font-weight: 500;
    line-height: 1.4;
    -webkit-font-smoothing: antialiased;
  }

  main {
    max-width: 48rem;
    margin: 0 auto;
    padding: 3rem 1.5rem 2rem;
  }
  @media (max-width: 40rem) { main { padding: 1.5rem 1rem; } }

  /* ---------- ızgara ---------- */

  .cerceve { border: var(--kalinlik) solid var(--murekkep); }
  .hucre + .hucre { border-top: var(--kalinlik) solid var(--murekkep); }

  /* ---------- künye ---------- */

  .kunye {
    padding: 1.6rem 1.4rem 1.3rem;
    font-weight: 700;
    font-size: clamp(2rem, 9vw, 4.25rem);
    line-height: 0.95;
    letter-spacing: -0.045em;
    text-transform: uppercase;
    overflow-wrap: anywhere;
  }
  .kunye b { color: var(--vurgu); font-weight: inherit; }

  /* ---------- şerit başlık ---------- */

  .serit {
    display: flex;
    justify-content: space-between;
    gap: 1rem;
    padding: 0.6rem 1.4rem;
    background: var(--murekkep);
    color: var(--kagit);
    font-family: var(--mono);
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.22em;
    text-transform: uppercase;
  }
  .serit span:last-child { letter-spacing: 0.1em; }

  /* ---------- çalışma satırı ---------- */

  .is {
    display: grid;
    grid-template-columns: 3.5rem 1fr 7rem;
    color: inherit;
    text-decoration: none;
    transition: background 0.12s linear, color 0.12s linear;
  }
  .is:hover, .is:focus-visible {
    background: var(--murekkep);
    color: var(--kagit);
  }

  .is .sira,
  .is .govde,
  .is .sag { padding: 1.5rem 0.9rem; }

  .is .sira {
    font-family: var(--mono);
    font-weight: 700;
    font-size: 0.9rem;
    color: var(--vurgu);
    padding-left: 1.4rem;
  }

  .is .govde { border-left: var(--kalinlik) solid currentColor; }

  .ad {
    font-weight: 700;
    font-size: clamp(1.4rem, 4.5vw, 2rem);
    line-height: 1;
    letter-spacing: -0.03em;
    text-transform: uppercase;
  }

  .aciklama {
    margin: 0.75rem 0 0;
    max-width: 28rem;
    font-size: 0.9rem;
    line-height: 1.5;
  }

  .yigin {
    margin: 0.9rem 0 0;
    font-family: var(--mono);
    font-size: 0.68rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    opacity: 0.65;
  }

  .is .sag {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: flex-end;
    border-left: var(--kalinlik) solid currentColor;
    padding-right: 1.4rem;
    font-family: var(--mono);
    font-size: 0.8rem;
    font-weight: 700;
  }
  .ok {
    font-size: 1.6rem;
    line-height: 1;
    transition: transform 0.16s ease;
  }
  .is:hover .ok, .is:focus-visible .ok { transform: translate(3px, -3px); }

  /* ---------- boş satır ---------- */

  .bos {
    display: grid;
    grid-template-columns: 3.5rem 1fr;
    font-family: var(--mono);
    font-size: 0.8rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
  }
  .bos span:first-child { padding: 1.1rem 0.9rem 1.1rem 1.4rem; font-weight: 700; }
  .bos span:last-child {
    padding: 1.1rem 1.4rem;
    border-left: var(--kalinlik) solid var(--murekkep);
    opacity: 0.5;
  }

  /* ---------- bağlantı ---------- */

  .bag {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    padding: 1.15rem 1.4rem;
    color: inherit;
    text-decoration: none;
    font-family: var(--mono);
    font-weight: 700;
    font-size: 0.85rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    transition: background 0.12s linear, color 0.12s linear;
  }
  .bag:hover, .bag:focus-visible {
    background: var(--vurgu);
    color: #fff;
  }

  footer {
    margin-top: 1rem;
    font-family: var(--mono);
    font-size: 0.68rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    opacity: 0.5;
  }

  :focus-visible { outline: var(--kalinlik) solid var(--vurgu); outline-offset: 3px; }

  /* dar ekranda sütunlar üst üste */
  @media (max-width: 34rem) {
    .is { grid-template-columns: 1fr; }
    .is .govde { border-left: 0; border-top: var(--kalinlik) solid currentColor; }
    .is .sira { padding-bottom: 0; }
    .is .sag {
      flex-direction: row;
      align-items: center;
      border-left: 0;
      border-top: var(--kalinlik) solid currentColor;
      padding-left: 1.4rem;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>
<main>

  <div class="cerceve">

    <h1 class="hucre kunye">gokh4n<b>.</b>dev</h1>

    <div class="hucre serit">
      <span>Çalışmalar</span>
      <span>02</span>
    </div>

    <a class="hucre is" href="https://games.gokh4n.dev">
      <span class="sira">01</span>
      <span class="govde">
        <span class="ad">Oyun Gecesi</span>
        <p class="aciklama">
          Arkadaşlarla telefondan oynanan çok oyunculu parti oyunları.
          Vampir Köylü, Casus Kim, Tabu, Yer Bilme. Oda kur, kodu paylaş.
        </p>
        <p class="yigin">Next · Socket.IO · TypeScript</p>
      </span>
      <span class="sag">
        <span>2026</span>
        <span class="ok" aria-hidden="true">↗</span>
      </span>
    </a>

    <div class="hucre bos">
      <span>02</span>
      <span>Yazılıyor</span>
    </div>

    <a class="hucre bag" href="https://github.com/gokhanaydinli" target="_blank" rel="noreferrer">
      <span>GitHub</span>
      <span aria-hidden="true">→</span>
    </a>

  </div>

  <footer><span id="yil">2026</span></footer>

</main>

<script>
  document.getElementById("yil").textContent = new Date().getFullYear();
</script>
</body>
</html>
